<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wishlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="store">

    <!-- Hanging sign -->
    <div class="sign-wrap">
      <div class="strings"><span></span><span></span></div>
      <div class="sign"><h1>Wishlist</h1></div>
    </div>

    <!-- Cabinet -->
    <div class="cabinet">
      <div class="cabinet-inner">

        <!-- SHELF 1 -->
        <section class="shelf">
          <div class="goods">
            <div class="unit"><div class="art">
              <div class="book">
                <div class="spine"></div>
                <div class="slot cover" style="width:120px;height:170px"><span class="ph">book cover</span></div>
              </div>
            </div></div>

            <div class="unit"><div class="art">
              <div class="frame"><div class="mat">
                <div class="slot" style="width:178px;height:122px"><span class="ph">a photo</span></div>
              </div></div>
            </div></div>

            <div class="unit"><div class="art">
              <div class="cbox">
                <div class="slot" style="width:112px;height:148px;border-radius:3px"><span class="ph">box front</span></div>
              </div>
            </div></div>
          </div>
          <div class="plank">
            <div class="tag"><span class="heart">&hearts;</span>No. 01</div>
            <div class="tag"><span class="heart">&hearts;</span>No. 02</div>
            <div class="tag"><span class="heart">&hearts;</span>No. 03</div>
          </div>
        </section>

        <!-- SHELF 2 -->
        <section class="shelf">
          <div class="goods">
            <div class="unit"><div class="art">
              <div class="vinyl">
                <div class="disc"></div>
                <div class="slot sleeve" style="width:150px;height:150px;border-radius:2px"><span class="ph">album art</span></div>
              </div>
            </div></div>

            <div class="unit"><div class="art">
              <div class="bottle">
                <div class="cap"></div>
                <div class="neck"></div>
                <div class="body">
                  <div class="slot label" style="width:60px;height:84px;border-radius:2px"><span class="ph">label</span></div>
                </div>
              </div>
            </div></div>

            <div class="unit"><div class="art">
              <div class="can">
                <div class="slot label" style="width:120px;height:94px"><span class="ph">can label</span></div>
              </div>
            </div></div>
          </div>
          <div class="plank">
            <div class="tag"><span class="heart">&hearts;</span>No. 04</div>
            <div class="tag"><span class="heart">&hearts;</span>No. 05</div>
            <div class="tag"><span class="heart">&hearts;</span>No. 06</div>
          </div>
        </section>

        <!-- SHELF 3 -->
        <section class="shelf">
          <div class="goods">
            <div class="unit"><div class="art">
              <div class="gjar">
                <div class="lid"></div>
                <div class="ring"></div>
                <div class="body">
                  <div class="slot label" style="width:82px;height:80px;border-radius:3px"><span class="ph">label</span></div>
                </div>
              </div>
            </div></div>

            <div class="unit"><div class="art">
              <div class="rtin">
                <div class="slot" style="width:132px;height:132px;border-radius:50%"><span class="ph">tin lid</span></div>
              </div>
            </div></div>

            <div class="unit"><div class="art">
              <div class="polaroid">
                <div class="slot" style="width:134px;height:132px"><span class="ph">snapshot</span></div>
              </div>
            </div></div>
          </div>
          <div class="plank">
            <div class="tag"><span class="heart">&hearts;</span>No. 07</div>
            <div class="tag"><span class="heart">&hearts;</span>No. 08</div>
            <div class="tag"><span class="heart">&hearts;</span>No. 09</div>
          </div>
        </section>

      </div>
    </div>

    <div class="footer">
      <div class="rule">&#10022;</div>
      everything I&rsquo;m wishing for, all in one little shop
    </div>

  </div>
</body>
</html>
